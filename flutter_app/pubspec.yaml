name: thirdhub_app
description: ThirdHub v4 Flutter - 纯播放器前端
publish_to: "none"
version: 4.81.93+50764

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  video_player: ^2.9.1
  chewie: ^1.8.5
  just_audio: ^0.9.40
  flutter_tts: ^4.2.0
  photo_manager: ^3.2.0
  photo_manager_image_provider: ^2.1.0
  webview_flutter: ^4.8.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  image: ^4.2.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.0
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  archive: ^3.6.0
  charset: ^2.0.1
  # ★4.81.84 端上引擎：Legado 书源规则里的 CSS 选择器要真解析 HTML
  html: ^0.15.4
  cryptography: ^2.7.0
  share_plus: ^10.0.2
  device_info_plus: ^11.1.0
  just_audio_background: ^0.0.1-beta.13
  flutter_local_notifications: ^17.2.3
  flutter_markdown: ^0.7.4
  # ★2026-10-17 LaTeX 公式渲染（Kimi 同款能力）：flutter_markdown 的官方扩展
  flutter_markdown_latex: ^0.3.4
  speech_to_text: ^7.0.0
  qr_flutter: ^4.1.0
  record: ^6.0.0
  flutter_contacts: ^1.1.9
  sensors_plus: ^7.1.0
  # 跨屏自适应布局（阶段2）。★ 钉死精确版本：0.x 包 API 未稳定，
  # 升版必须重验 adaptive.dart 的用法（skin_parity/adaptive_selfcheck + CI 编译）。
  # 选型证据：adaptive_navigation / adaptive_breakpoints / flutter_adaptive_scaffold
  # 均已停维（pub.dev isDiscontinued=true，2026-10 查证），此为唯一存活的成熟方案。
  dynamic_layouts: 0.7.0
  # ★4.81.76 补登：`bili_player.dart` 4.81.74 起就 import 了它，但 pubspec 一直没写，
  #   于是 4.81.75 的 build-apk 在编译期挂在 "Couldn't resolve the package
  #   'canvas_danmaku'"。纯 Dart 实现（CustomPainter 直绘），SDK 要求 >=3.0.0
  #   与本项目一致，无平台代码、无 minSdk 抬升。
  canvas_danmaku: ^0.3.4
  # ★4.81.81 播放器重做：竖滑左半屏调亮度、右半屏调音量 —— 这是 YouTube /
  #   B站 / Netflix 客户端都有的手势，缺了它玩家会觉得"不是正经播放器"。
  #   两个包都是纯平台通道实现，minSdk 24 满足；失败一律 try/catch 静默降级。
  screen_brightness: ^2.1.11
  volume_controller: ^3.7.1
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/vendor_icons/
    # 自家商标（与网页端 icons/launcher-96.png 、icons/launcher.png 逐字节同源）。
    # 开屏页此前用 Material 内置的 Icons.hub_outlined —— 那是系统通用图标，
    # 与网页端、桌面快捷方式不是同一个东西，用户看到的就是「开屏不是自家标」。
    - assets/branding/
    # ★4.81.84 端上引擎的源池（995 个纯选择器书源，约 0.9MB）。
    # 打进包才能「脱离后端也能搜」——后端只做兜底。
    - assets/sources/

dependency_overrides:
  # objective_c 9.6.x 的构建钩子引用了 code_assets 2.0 才有的 Architecture.arm64e，
  # 与当前 Flutter stable 内置版本不兼容，锁回 9.5.0
  objective_c: 9.5.0
  # ★4.81.84 修 CI 红灯：4.81.84 加 intl 时 flutter pub add 触发全局 re-resolve，
  #   把 shared_preferences_foundation 从 2.5.7 顶到 2.6.2；而 2.6.2 的 generated
  #   bindings 要求 objective_c ^9.6.0，与上面锁死的 9.5.0 冲突 → kernel_snapshot
  #   编译期常量断言失败。锁回 2.5.7（4.81.83 全绿的同一版本），objective_c 不动。
  shared_preferences_foundation: 2.5.7

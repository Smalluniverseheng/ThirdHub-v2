# B 站下载（bilidown-nas）· NAS 侧
# ============================================================
#  作用：把 B 站视频/音频下到 NAS，App 里的「B站下载」模块通过后端桥接调它。
#
#  镜像：不在 Docker Hub，只在 GitHub Release 里有 tar.gz
#    https://github.com/fredqin2006-X/bilidown-nas/releases
#    restore.sh 会尝试自动下载并 docker load；手动等价操作：
#      curl -L -o /tmp/bilidown.tar.gz <release asset url>
#      docker load -i /tmp/bilidown.tar.gz
#
#  ★ 端口不绑具体 IP（0.0.0.0:8098）。踩过的坑：绑死 192.168.31.200 后，
#    换 NAS / 换 IP 时 docker 绑不上这个不存在的地址，容器直接 Exited(255)。
#
#  ★ 这个服务本身没有登录（设计如此，网页端共用一个下载队列），
#    所以只在内网暴露，不要做公网端口映射。
# ============================================================
services:
  bilidown:
    image: bilidown-nas:2.1.1-nas.4
    container_name: bilidown
    user: "1000:1000"
    init: true
    restart: unless-stopped
    ports:
      - "8098:8098"
    environment:
      TZ: Asia/Shanghai
      # 宿主机上的真实下载目录，用于在 App/网页里显示「文件在哪」
      BILIDOWN_DOWNLOAD_HOST_PATH: /vol1/1000/Media/_下载/B站
    volumes:
      - /vol1/1000/Media/_配置/bilidown/data:/data
      - /vol1/1000/Media/_下载/B站:/downloads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    mem_limit: 1g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

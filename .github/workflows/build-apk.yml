name: build-apk

# 为什么用 flutter build 而不是直接 gradlew：
#   android/settings.gradle.kts 里 `require(sdk != null) { "flutter.sdk not set in local.properties" }`
#   —— local.properties 不进版本库，直接调 gradlew 一定在这里炸。
#   flutter build 会自己生成它，产物路径也固定。
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths: ['flutter_app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: decode release keystore
        run: |
          printf '%s' "${{ secrets.TH_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/thirdhub-release.jks"
          [ -s "$RUNNER_TEMP/thirdhub-release.jks" ] || { echo "keystore 解码为空"; exit 1; }
          ls -l "$RUNNER_TEMP/thirdhub-release.jks"

      - name: pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: build APK (arm64)
        working-directory: flutter_app
        env:
          TH_STORE_FILE: ${{ runner.temp }}/thirdhub-release.jks
          TH_STORE_PASSWORD: ${{ secrets.TH_STORE_PASSWORD }}
          TH_KEY_PASSWORD: ${{ secrets.TH_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64

      - name: read version
        id: v
        working-directory: flutter_app
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([0-9.]+).*/\1/')
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "version = $VER"

      - name: rename artifact
        run: cp flutter_app/build/app/outputs/flutter-apk/app-release.apk "ThirdHub-${{ steps.v.outputs.ver }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ThirdHub-${{ steps.v.outputs.ver }}
          path: ThirdHub-${{ steps.v.outputs.ver }}.apk
          if-no-files-found: error

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          name: ThirdHub v${{ steps.v.outputs.ver }}
          files: ThirdHub-${{ steps.v.outputs.ver }}.apk
          prerelease: false

name: build-apk
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths: ['flutter_app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: pub get
        working-directory: flutter_app
        run: flutter pub get
      - name: build APK (arm64)
        working-directory: flutter_app/android
        # 直接调 gradlew：flutter build apk 在某些环境找不到产物路径
        run: bash ./gradlew assembleRelease -Ptarget-platform=android-arm64 --console=plain
      - name: read version
        id: v
        working-directory: flutter_app
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([0-9.]+).*/\1/')
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: rename artifact
        run: cp flutter_app/android/app/build/outputs/apk/release/app-release.apk "ThirdHub-${{ steps.v.outputs.ver }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ThirdHub-${{ steps.v.outputs.ver }}
          path: ThirdHub-${{ steps.v.outputs.ver }}.apk
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          name: ThirdHub v${{ steps.v.outputs.ver }}
          files: ThirdHub-${{ steps.v.outputs.ver }}.apk
          prerelease: false

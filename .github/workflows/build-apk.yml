name: build-apk

# 为什么直接调 gradlew 而不是 `flutter build apk`：
#   实测（run #35）`flutter build apk --release` 在 runner 上会报
#   "Gradle build failed to produce an .apk file ..." —— gradle 其实跑完了 479s，
#   是 flutter 工具自己没在预期路径找到产物（日志里还有 "Already watching path" 异常）。
#   直接 gradlew 出 `app/build/outputs/apk/release/app-release.apk` 是稳定路径。
#   注意：必须先 `flutter pub get` ——它会生成 android/local.properties，
#   而 settings.gradle.kts 里有 `require(sdk != null) { "flutter.sdk not set in local.properties" }`。
permissions:
  contents: write

on:
  push:
    branches: [main]
    paths: ['flutter_app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: decode release keystore
        run: |
          printf '%s' "${{ secrets.TH_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/thirdhub-release.jks"
          [ -s "$RUNNER_TEMP/thirdhub-release.jks" ] || { echo "keystore 解码为空"; exit 1; }
          ls -l "$RUNNER_TEMP/thirdhub-release.jks"

      # ① 生成 android/local.properties（flutter.sdk）——settings.gradle.kts 强依赖
      # ② 补写 flutter.versionCode / flutter.versionName —— 这一项必须手工补：
      #    直接跑 gradlew 时 flutter 工具不会写这两个键，而 FlutterPlugin.kt:132 是
      #    `rootProjectLocalProperties.getProperty("flutter.versionCode", "1")`，
      #    取不到就静默回落到 versionCode=1 / versionName=1.0（run #36 出包实测如此）。
      - name: pub get
        working-directory: flutter_app
        run: |
          flutter pub get
          grep -q '^flutter.sdk=' android/local.properties && echo "local.properties OK"
          FULL=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | tr -d '\r')
          NAME=${FULL%%+*}
          CODE=${FULL#*+}
          [ "$CODE" = "$FULL" ] && CODE=1
          sed -i '/^flutter\.versionCode=/d;/^flutter\.versionName=/d' android/local.properties
          printf 'flutter.versionCode=%s\nflutter.versionName=%s\n' "$CODE" "$NAME" >> android/local.properties
          echo "--- local.properties ---"
          cat android/local.properties

      - name: build APK (arm64)
        working-directory: flutter_app/android
        env:
          TH_STORE_FILE: ${{ runner.temp }}/thirdhub-release.jks
          TH_STORE_PASSWORD: ${{ secrets.TH_STORE_PASSWORD }}
          TH_KEY_PASSWORD: ${{ secrets.TH_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -Ptarget-platform=android-arm64 --console=plain
          echo "--- release 目录 ---"
          ls -l app/build/outputs/apk/release/ || true

      - name: locate apk
        run: |
          SRC=flutter_app/android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            echo "预期路径没有产物，全盘找一下："
            find flutter_app -name '*.apk' -exec ls -l {} \; || true
            SRC=$(find flutter_app -name 'app-release*.apk' | head -1)
          fi
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then echo "没有任何 APK 产物"; exit 1; fi
          echo "APK=$SRC" >> "$GITHUB_ENV"
          ls -l "$SRC"

      - name: read version
        id: v
        working-directory: flutter_app
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([0-9.]+).*/\1/')
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "version = $VER"

      - name: verify signing & versionName (防止静默回落到 debug 签名 / versionCode=1)
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/apksigner" verify --print-certs "$APK" > /tmp/certs.txt 2>&1 || true
          cat /tmp/certs.txt
          if grep -qi 'Android Debug' /tmp/certs.txt; then
            echo "::error::APK 用了 debug 签名 —— 无法覆盖安装正式版，检查 TH_KEYSTORE_BASE64"
            exit 1
          fi
          echo "--- badging ---"
          "$BT/aapt2" dump badging "$APK" | head -1
          "$BT/aapt2" dump badging "$APK" | grep -q "versionName='${{ steps.v.outputs.ver }}'" \
            || { echo "::error::APK versionName 与 pubspec 的 ${{ steps.v.outputs.ver }} 不一致（versionCode 回落了？）"; exit 1; }

      - name: rename artifact
        run: cp "$APK" "ThirdHub-${{ steps.v.outputs.ver }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ThirdHub-${{ steps.v.outputs.ver }}
          path: ThirdHub-${{ steps.v.outputs.ver }}.apk
          if-no-files-found: error

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          name: ThirdHub v${{ steps.v.outputs.ver }}
          files: ThirdHub-${{ steps.v.outputs.ver }}.apk
          prerelease: false

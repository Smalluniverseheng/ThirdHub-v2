name: dart-selfcheck

# 纯 Dart 自检「十连」——这是本仓改动后端到端的**最低成本闸门**。
#
# 为什么要有这个 workflow（此前是空白）：
#   · 本机 `dart analyze` / `dart compile` / `flutter test` 全部因
#     `CreateFile failed 231`（管道池耗尽）不可用 —— 也就是说本地**没有类型检查**；
#   · 而 agent-selfcheck 只覆盖 agent_* / ai_agent / local_tools 三类路径，
#     nav_swipe / modules / peer_hub / changelog / settings_bridge **从来没有在 CI 里跑过**，
#     全靠「人记得在本机敲一遍」。凡是靠人记得的门禁，迟早会漏。
#   · 本 workflow 不做类型检查（那是 build-apk 的活），只跑自检断言：
#     秒级完成，失败信息比编译器直白得多，能一次说清是哪条契约破了。
#
# 九连（2026-09-25 本机实测，九条全部按直调 VM 方式跑出）：
#   nav_swipe 57 · local_tools 135 · agent_proto 191 · modules 202
#   agent 120 · peer_hub 327 · changelog 52 · settings_bridge 111 · i18n 17
#   → PASS 1212 / FAIL 0
#   注：settings_bridge 此前文档记的是 95，实测已是 111（该自检 09-25 扩过），
#       这里以实测为准。agent_proto 的 PASS 行格式是「全部通过 191/191」，
#       不是「PASS n FAIL n」，脚本汇总时要单独认。
#
# ★★2026-09-28 重大加固：这些自检此前**只会打印、不会拦**。
#   本 workflow 跑的是 `dart run tool/x.dart`，**只看退出码**；而 10 个自检里
#   有 8 个从不调用 `exit()` —— 于是 `print('FAIL 1')` 之后仍然 `return 0`，
#   CI 一律 success。等于前九条闸门全是装饰。
#   （怎么发现的：给 i18n 加行为断言后做**反证** —— 故意把 `tr()` 改回缺陷版，
#     输出 `PASS 28 FAIL 1`，可 `$?` 仍是 0。若不看退出码，这次中文回退的
#     真实缺陷会**再次被放行**。）
#   已给 8 个脚本补 `if (<fail> > 0) exit(1);`，并逐条实测：
#     绿 → exit 0；故意造一条失败 → exit 1。
#   ⇒ 结论：**"打印了 FAIL" ≠ "闸门拦住了"**，判据必须是退出码。
#
#   十连实测（2026-09-28，全部 exit 0）：
#     nav_swipe 57 · local_tools 135 · agent_proto 191 · modules 202 · agent 120
#     · peer_hub 327 · changelog 52 · settings_bridge 111 · i18n **29** · module_registry 38
#     → PASS 1262 / FAIL 0
#   i18n 从 17 → 29：新增 §3.5「查找行为」断言（见下条说明）。
#
# 第 11 条 chat_proto（2026-10-01 加）—— 局域网聊天协议 LANCHAT/1：
#   为什么必须进 CI —— 聊天的三个契约**都不会在界面上报错**，只会悄悄错：
#     ① 去重：广播 + 单播双到达若不去重 = 对方每句话显示两遍；
#     ② 降级：端到端加密不可用时**必须给原因**，否则用户以为"加密开着"；
#        给不出原因就只能明文，而"明文"和"加密"在气泡上只是一个锁图标之差；
#     ③ 密钥协商：双方算出的 salt 只要拼接顺序不同，A 能加密 B 就解不开，
#        而且是**静默的** —— 解密失败返回 null，气泡显示空白，没有异常栈。
#   这三条全靠人眼在双机上试是查不出来的（要两台设备 + 恰好触发）。本自检
#   用固定向量把「A 加密 → B 解密」「第三方解不开」「改 1 字节即失败」
#   一次性断言掉，且直接 import lib/core/chat_logic.dart 与 chat_crypto.dart，
#   这两文件若被漏推远端，本 workflow 立刻变红（与 module_registry 同理）。
#   实测（2026-10-01 本机）：PASS 101 / FAIL 0，exit 0。
#
# 第 12 条 ui_icons（2026-10-01 加）—— D-H2「UI 不许出现 emoji」：
#   为什么必须进 CI —— 这不是风格问题，是**两条都会静默失效**的缺陷：
#     ① UI 面残留 emoji：不会报错、不会崩，只是某个角落和别处不一致，
#        靠人眼在 60 多个模块里找等于没找。清完一次，下次改代码又会加回来。
#     ② ★更要命的一条：数据里 '🤖' 换成 'robot' 之后，如果渲染退回
#        `Text(a.icon)`，**emoji 扫描器照样绿** —— 因为源码里已经没有 emoji 了 ——
#        但用户看到的是字面量 "robot"。这种"扫描器绿、界面坏"的改法
#        只能靠单独断言拦（本自检第 4 节）。
#   口径：只认 UI 面（`lib/**` 与 `server/public/**`），要求恒为 0；
#   文档里的 ✅/❌ 状态表与自检脚本往终端打印的 ✅ **不算**（清了反而看不懂）。
#   实测（2026-10-01 本机）：PASS 68 / FAIL 0，exit 0；
#   并做过反证：故意写一处 Text(a.icon) 与一处真实 emoji，两次都 exit 1。
#
# 第 13 条 tts_engines（2026-10-01 加）—— 开源 TTS 引擎接入契约（TTS/1）：
#   为什么必须进 CI —— 判定错的后果是**安静地把错的东西当成引擎**：
#     ① 只看 `ok: true` → 任何返回 `{"ok":true}` 的 REST 服务都会被认成引擎。
#        用户把阅读引擎 :1234 或资源库 :9527 填进来，界面照样显示"已连接"，
#        然后听书点了没声音 —— 与 PH/1 那次"发现≠接入"是同一类坑。
#     ② 地址归一化的两个真缺陷就是本自检抓出来的：
#        `Uri.parse('https://x:443').hasPort == false`（Dart 把默认端口视为没写），
#        照 hasPort 补端口会把地址改成 `:5100`；IPv6 的 `Uri.host` 不带方括号，
#        手工拼字符串会得到 `http://fe80::1:5100` 这种无法解析的东西。
#   实测（2026-10-01 本机）：PASS 69 / FAIL 0，exit 0。
#
# 第 10 条 module_registry（2026-09-27 加）：
#   为什么必须进 CI —— 09-27 实测 CI `build-apk` 红了整整一轮，
#   根因是 `lib/core/module_registry.dart` **根本不在远端仓库**（main.dart 第 51 行
#   import 它），连带 migrateModuleKeys / kReadGroupAppKeys / Cloud.navLayoutChanged
#   全部未定义。而 dart-selfcheck 却是 success —— 因为它跑的是 `dart run tool/x.dart`，
#   只编译该入口的传递依赖，而自检脚本是把 main.dart 当**文本**读的，永远看不见
#   「main.dart import 的文件不存在」。这条自检直接 import 那个 lib，一旦文件再缺，
#   本 workflow 立刻变红 —— 把「漏推文件」从「只有真编译能发现」提前到秒级。
#
# ★本机也能跑这套（此前误以为"本地 dart 全废"）：
#   `dart analyze` 会 spawn analysis_server 而被管道池耗尽挡住，但**直调 VM 可以**：
#     D:/ai/flutter/bin/cache/dart-sdk/bin/dart.exe \
#       --disable-dart-dev --packages=.dart_tool/package_config.json \
#       tool/i18n_selfcheck.dart
#   在 flutter_app 目录下运行即可（注意必须带 --packages，否则 pub 会因
#   objective_c 的 native assets 校验直接退出）。本地 57 与 CI 57 一致，可信。
#
# 为什么第 9 条是 i18n（2026-09-25 加）：
#   缺键回退是**静默的** —— 目标语言没有就悄悄显示英文，连 en 都没有就悄悄
#   显示中文，不报错不崩不留日志。实测有 18 个键在**全部 6 种语言都缺**
#   （含刚从硬编码改成 tr() 的「确认资源库指纹」「信任」），任何语言都显示
#   中文。靠人眼在 200 键 × 6 语言里查等于没查，所以做成闸门。
#
# 注意：这些脚本必须 `working-directory: flutter_app` 下运行 ——
# agent_proto_selfcheck 要读 `../server/agent-profiles.json` 做逐工具对拍，
# changelog_selfcheck 要读 `lib/main.dart` 做双向核对，
# i18n_selfcheck 要读 `lib/core/i18n*.dart` 并遍历 `lib/**` 收集 tr() 用法。
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/lib/**'
      - 'flutter_app/tool/**'
      - 'flutter_app/pubspec.yaml'
      - 'docs/LANCHAT-PROTOCOL.md'
      - 'docs/AGENT-PROTOCOL.md'
      - 'docs/TTS-PROTOCOL.md'
      - 'server/agent-profiles.json'
      - '.github/workflows/dart-selfcheck.yml'
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: nav_swipe
        working-directory: flutter_app
        run: dart run tool/nav_swipe_selfcheck.dart

      - name: local_tools
        working-directory: flutter_app
        run: dart run tool/local_tools_selfcheck.dart

      - name: agent_proto（含与服务端 agent-profiles.json 逐工具对拍）
        working-directory: flutter_app
        run: dart run tool/agent_proto_selfcheck.dart

      - name: modules（与 main.dart 的模块注册双向核对）
        working-directory: flutter_app
        run: dart run tool/modules_selfcheck.dart

      - name: module_registry（共享注册表：上行压缩/下行展开/旧 id 兼容/两端往返，并 import 该 lib 本身防漏推）
        working-directory: flutter_app
        run: dart run tool/module_registry_selfcheck.dart

      - name: agent
        working-directory: flutter_app
        run: dart run tool/agent_selfcheck.dart

      - name: peer_hub
        working-directory: flutter_app
        run: dart run tool/peer_hub_selfcheck.dart

      - name: changelog（65 模块 ↔ main.dart 双向核对）
        working-directory: flutter_app
        run: dart run tool/changelog_selfcheck.dart

      - name: settings_bridge（设置 38 键两端一致）
        working-directory: flutter_app
        run: dart run tool/settings_bridge_selfcheck.dart

      - name: i18n（zh 短路 + 6 语言 × tr() 全键覆盖 + 查找行为断言）
        working-directory: flutter_app
        run: dart run tool/i18n_selfcheck.dart

      - name: chat_proto（局域网聊天 LANCHAT/1：信封/去重排序/降级原因/端到端加密）
        working-directory: flutter_app
        run: dart run tool/chat_proto_selfcheck.dart

      - name: ui_icons（D-H2：UI 面 emoji 必须为 0 + 拦住退回 Text(icon) 的改法）
        working-directory: flutter_app
        run: dart run tool/ui_icons_selfcheck.dart

      - name: tts_engines（开源 TTS 引擎 TTS/1 契约：地址归一化 + 五类失败分开报）
        working-directory: flutter_app
        run: dart run tool/tts_engines_selfcheck.dart

      - name: tts_vendors（在线 TTS 厂商契约：请求构建 + 四种响应形态 + 自定义厂商往返）
        working-directory: flutter_app
        run: dart run tool/tts_vendors_selfcheck.dart

      # ★第 15 步 analyze（2026-10-01 加）—— 补上「自检全绿 ≠ 能编译」这个缺口。
      #   为什么必须进 CI：本机 `dart analyze` 因管道池耗尽（CreateFile failed 231）
      #   跑不了，于是本地**没有任何类型检查**；而纯 Dart 自检不 import flutter，
      #   看不见 widget 层的问题。4.56.0 那轮就是活例：18 项自检全绿，真编译却报
      #   「The getter 'TtsBackend' isn't defined」（少了一个 import）与
      #   「const 表达式里不能对 List 取 .length」两条 —— 都只有真编译才看得见。
      #   加这一步后，这类错误在秒级反馈，不必等整个 build-apk 跑完。
      #   参数只写 --no-fatal-warnings：dart analyze 的 infos 默认就不致命
      #   （没有 --no-fatal-infos 这个开关，写了会 exit 64：
      #    「Cannot negate option "--no-fatal-infos"」—— 本步第一次就是这么红的），
      #   而 warnings 默认致命（--[no-]fatal-warnings defaults to on），
      #   所以要「只拦 error」必须显式关掉 warnings。
      - name: analyze（类型检查 —— 本机跑不了，搬到这里）
        working-directory: flutter_app
        run: dart analyze --no-fatal-warnings lib/

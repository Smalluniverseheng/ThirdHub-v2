name: Build ThirdHub-Flutter APK (cross-repo)

# ── 为什么这个工作流放在 public 仓，而不是 Flutter 仓自己里 ──────────────────────
# Flutter 客户端仓 Smalluniverseheng/ThirdHub-Flutter 是 **private**。
# GitHub 对私有仓的 Actions 每月只给 2000 分钟免费额度，超出后需要有效付款方式。
# 2026-09 该账号私有仓实际用量 2673 分钟（>2000），GitHub 因此拒绝启动该仓的
# **所有** job，官方注解原文：
#   "The job was not started because recent account payments have failed or your
#    spending limit needs to be increased."
# 表现就是 Actions 面板上「0 步骤、无 runner、几秒内 failure」——
# 这不是工作流写错了，是账号计费闸门。
#
# 本仓（ThirdHub-v2）是 **public**，Actions 分钟数免费无限，不受该闸门影响。
# 所以把出包流程搬到这里跑：源码用 token 经 REST tarball 拉取，
# **Flutter 仓本身仍然保持 private，源码不公开**。
#
# 需要 secret：TH_FLUTTER_TOKEN —— 一个能读 Smalluniverseheng/ThirdHub-Flutter 的 token。
# ────────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-thirdhub-flutter.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'ThirdHub-Flutter 的 ref（分支 / tag / commit sha），留空则 master 默认分支'
        required: false
        default: 'main'
      assets_asset_id:
        description: '引擎资产 Release asset id（留空用默认）'
        required: false
        default: '586451223'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve inputs
        id: inp
        run: |
          set -euo pipefail
          REF='${{ github.event.inputs.ref }}'
          AID='${{ github.event.inputs.assets_asset_id }}'
          if [ -z "$REF" ]; then REF='main'; fi
          if [ -z "$AID" ]; then AID='586451223'; fi
          echo "ref=$REF"   >> "$GITHUB_OUTPUT"
          echo "aid=$AID"   >> "$GITHUB_OUTPUT"

      - name: Fetch private source (REST tarball)
        env:
          TOKEN: ${{ secrets.TH_FLUTTER_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p src
          curl -sSL --retry 3 -f \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/src.tar.gz \
            "https://api.github.com/repos/Smalluniverseheng/ThirdHub-Flutter/tarball/${{ steps.inp.outputs.ref }}"
          ls -l /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C src --strip-components=1
          test -f src/pubspec.yaml
          test -f src/lib/main.dart
          echo "--- source tree ---"
          ls src

      - name: Fetch engine assets (private Release asset)
        env:
          TOKEN: ${{ secrets.TH_FLUTTER_TOKEN }}
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -f \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/octet-stream" \
            -o /tmp/assets.tar.gz \
            "https://api.github.com/repos/Smalluniverseheng/ThirdHub-Flutter/releases/assets/${{ steps.inp.outputs.aid }}"
          ls -l /tmp/assets.tar.gz
          sha256sum /tmp/assets.tar.gz
          tar -xzf /tmp/assets.tar.gz -C src
          test -d src/assets/engine/js
          test -d src/assets/sources
          du -sh src/assets

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      - name: Read app version
        id: appver
        working-directory: src
        run: |
          v=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          name=${v%%+*}
          code=${v##*+}
          echo "raw=$v"      >> "$GITHUB_OUTPUT"
          echo "name=$name"  >> "$GITHUB_OUTPUT"
          echo "code=$code"  >> "$GITHUB_OUTPUT"
          echo "pubspec version = $v  (name=$name code=$code)"

      - name: Analyze (只做记录，不阻断出包)
        working-directory: src
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos || echo "::warning title=flutter analyze 有告警::详见上文日志"

      - name: Build release APK
        working-directory: src
        run: flutter build apk --release

      - name: Rename + checksum
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p out
          OUT="out/ThirdHub-Flutter-v${{ steps.appver.outputs.name }}-${{ steps.appver.outputs.code }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT"
          sha256sum "$OUT" | tee "out/SHA256SUMS.txt"
          ls -l out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thirdhub-flutter-apk-${{ steps.appver.outputs.name }}
          path: |
            src/out/*.apk
            src/out/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish to public Release (匿名可下)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-v${{ steps.appver.outputs.name }}
          name: ThirdHub Flutter 客户端 v${{ steps.appver.outputs.name }}
          files: src/out/*.apk
          fail_on_unmatched_files: true
          body: |
            ThirdHub Flutter 客户端（新主线，左滑右滑产品线）自动构建产物。

            - 版本：`${{ steps.appver.outputs.raw }}`
            - 来源：`Smalluniverseheng/ThirdHub-Flutter @ ${{ steps.inp.outputs.ref }}`
            - 签名：debug key（可直接安装，覆盖安装同一签名的旧版）
            - 构建：GitHub Actions（public 仓免费额度）

            安装：下载下方 `ThirdHub-Flutter-v*.apk` 直接安装。

# ThirdHub v4 自动构建: tag v4* → 全平台出包
# 前端: Android APK + Windows/macOS/Linux 桌面
# 后端: Android APK(内嵌node) + Docker
name: build-m1
on:
  push:
    tags: ["v4*"]
  workflow_dispatch:

jobs:
  backend-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: 注入 Node 二进制 + 后端代码到 assets
        run: |
          mkdir -p android/app/src/main/assets/node/bin android/app/src/main/assets/server /tmp/nodex
          curl -sL https://nodejs.org/dist/v20.17.0/node-v20.17.0-linux-arm64.tar.xz | tar xJ -C /tmp/nodex
          mv /tmp/nodex/node-v*/bin/node android/app/src/main/assets/node/bin/node
          chmod +x android/app/src/main/assets/node/bin/node || true
          cp -r server/* android/app/src/main/assets/server/
      - uses: android-actions/setup-android@v3
      - name: 构建 APK
        run: |
          cd android
          base64 -d thirdhub.jks.b64 > thirdhub.jks
          gradle wrapper --gradle-version 8.7 --no-daemon || true
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleRelease --no-daemon || gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: thirdhub-backend-apk, path: android/app/build/outputs/apk/release/*.apk }
      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: android/app/build/outputs/apk/release/*.apk, body: "ThirdHub 后端 APK" }

  flutter-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: |
          cd flutter_app
          flutter pub get
          cd android && gradle wrapper --gradle-version 8.14 --no-daemon || true
          cd .. && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: thirdhub-flutter-apk, path: flutter_app/build/app/outputs/flutter-apk/*.apk }
      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: flutter_app/build/app/outputs/flutter-apk/*.apk, body: "ThirdHub Flutter 前端 APK" }

  # ── 桌面端三件套: Flutter 跨平台(自用未签名构建) ──
  flutter-desktop:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: windows, out: "build/windows/x64/runner/Release" }
          - { os: macos-latest, target: macos, out: "build/macos/Build/Products/Release" }
          - { os: ubuntu-latest, target: linux, out: "build/linux/x64/release/bundle" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Linux 桌面依赖
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgtk-3-dev
      - name: 构建桌面端
        run: |
          cd flutter_app
          flutter pub get
          flutter config --enable-windows-desktop --enable-macos-desktop --enable-linux-desktop || true
          flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: thirdhub-flutter-${{ matrix.target }}
          path: flutter_app/${{ matrix.out }}

  docker-server:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: |
          cd server
          docker build -t thirdhub/server:4.0.0-m2 .
      # 推送 registry 二期配置

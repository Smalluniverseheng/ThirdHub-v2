# ThirdHub v4 自动构建: tag v4* → 全平台出包
# 前端: Android APK + Windows/macOS/Linux 桌面
# 后端: Android APK(内嵌node) + Docker
name: build-m1
on:
  push:
    tags: ["v4*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: 注入 Android(bionic) Node 运行时 + 后端代码到 assets
        run: bash server/scripts/fetch-node-android.sh
      - name: 接受 Android SDK 许可（runner 预装 SDK，无需 setup-android）
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: 构建 APK
        run: |
          cd android
          base64 -d thirdhub.jks.b64 > thirdhub.jks
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleRelease --no-daemon || gradle assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/thirdhub-backend.apk
      - name: 发 Release（先于 artifact 上传，配额满也不影响交付）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: android/app/build/outputs/apk/release/thirdhub-backend.apk, body: "ThirdHub 后端 APK" }
      - name: 上传 Supabase 下载桶（网站直链）
        run: |
          curl -s -X POST "https://mxvxlgjzeboktufumxbp.supabase.co/storage/v1/object/downloads/thirdhub/thirdhub-backend.apk" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @android/app/build/outputs/apk/release/thirdhub-backend.apk
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: thirdhub-backend-apk, path: android/app/build/outputs/apk/release/*.apk }

  flutter-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - env:
          TH_KEY_STORE: ${{ secrets.TH_KEY_STORE }}
          TH_STORE_FILE: ../thirdhub.jks
          TH_STORE_PASSWORD: ${{ secrets.TH_STORE_PASSWORD }}
          TH_KEY_PASSWORD: ${{ secrets.TH_KEY_PASSWORD }}
        run: |
          printf '%s' "$TH_KEY_STORE" | base64 --decode > "$GITHUB_WORKSPACE/flutter_app/android/thirdhub.jks"
          mkdir -p /tmp/wrapper && cd /tmp/wrapper && touch settings.gradle && gradle wrapper --gradle-version 8.14 --no-daemon
          cp -r /tmp/wrapper/gradlew /tmp/wrapper/gradlew.bat /tmp/wrapper/gradle "$GITHUB_WORKSPACE/flutter_app/android/"
          cd "$GITHUB_WORKSPACE/flutter_app"
          flutter pub get
          flutter build apk --release --split-per-abi || true
          if [ ! -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            (cd android && ./gradlew :app:assembleRelease --no-daemon)
          fi
          find "$GITHUB_WORKSPACE/flutter_app" -name "*.apk" || true
          APK=$(find "$GITHUB_WORKSPACE/flutter_app" -name "app-arm64-v8a-release.apk" | head -1)
          [ -z "$APK" ] && APK=$(find "$GITHUB_WORKSPACE/flutter_app" -name "app-release.apk" | head -1)
          test -n "$APK"
          mkdir -p build/app/outputs/flutter-apk
          cp "$APK" build/app/outputs/flutter-apk/thirdhub-app.apk
      - name: 发 Release（先于 artifact 上传，配额满也不影响交付）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: flutter_app/build/app/outputs/flutter-apk/thirdhub-app.apk, body: "ThirdHub Flutter 前端 APK" }
      - name: 上传 Supabase 下载桶（网站直链）
        run: |
          curl -s -X POST "https://mxvxlgjzeboktufumxbp.supabase.co/storage/v1/object/downloads/thirdhub/thirdhub-app.apk" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @flutter_app/build/app/outputs/flutter-apk/thirdhub-app.apk
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: thirdhub-flutter-apk, path: flutter_app/build/app/outputs/flutter-apk/*.apk }

  # ── 桌面端三件套: Flutter 跨平台(自用未签名构建) ──
  flutter-desktop:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: windows, out: "build/windows/x64/runner/Release" }
          - { os: macos-latest, target: macos, out: "build/macos/Build/Products/Release" }
          - { os: ubuntu-latest, target: linux, out: "build/linux/x64/release/bundle" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Linux 桌面依赖
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgtk-3-dev
      - name: 构建桌面端
        run: |
          cd flutter_app
          flutter pub get
          flutter config --enable-windows-desktop --enable-macos-desktop --enable-linux-desktop || true
          flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: thirdhub-flutter-${{ matrix.target }}
          path: flutter_app/${{ matrix.out }}

  docker-server:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: |
          cd server
          docker build -t thirdhub/server:4.0.0-m2 .
      # 推送 registry 二期配置

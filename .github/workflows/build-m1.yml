# ThirdHub v4 自动构建: tag v4* → 全平台出包
# 前端: Android APK + Windows/macOS/Linux 桌面
# 后端: Android APK(内嵌node) + Docker
name: build-m1
on:
  push:
    tags: ["v4*","v5*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: 注入 Android(bionic) Node 运行时 + 后端代码到 assets
        run: bash server/scripts/fetch-node-android.sh
      - name: 接受 Android SDK 许可（runner 预装 SDK，无需 setup-android）
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      # 密钥不入库：从 secrets 还原 keystore 与 keystore.properties（见 android/README.md）
      - name: 注入签名材料
        env:
          KS_A: ${{ secrets.TH_KEYSTORE_BASE64 }}
          KS_B: ${{ secrets.TH_KEY_STORE }}
          SP: ${{ secrets.TH_STORE_PASSWORD }}
          KP: ${{ secrets.TH_KEY_PASSWORD }}
        run: |
          KS="$KS_A"; [ -n "$KS" ] || KS="$KS_B"
          [ -n "$KS" ] || { echo "::error::缺少 keystore secret（TH_KEYSTORE_BASE64 / TH_KEY_STORE）"; exit 1; }
          printf '%s' "$KS" | base64 -d > "$GITHUB_WORKSPACE/android/thirdhub.jks"
          [ -s "$GITHUB_WORKSPACE/android/thirdhub.jks" ] || { echo "::error::keystore 解码为空"; exit 1; }
          {
            echo "storeFile=thirdhub.jks"
            echo "storePassword=$SP"
            echo "keyAlias=thirdhub"
            echo "keyPassword=$KP"
          } > "$GITHUB_WORKSPACE/android/keystore.properties"
          chmod 600 "$GITHUB_WORKSPACE/android/keystore.properties"
          ls -l "$GITHUB_WORKSPACE/android/thirdhub.jks"
      - name: 取出进包版本（唯一来源 = server/package.json）
        id: ver
        run: |
          node -e "
            const p=require('./server/package.json');
            const [M,m,f]=p.version.split('-')[0].split('.').map(Number);
            const code=42000+m*100+f;
            console.log('server 版本 '+p.version+' -> versionName='+p.version+' versionCode='+code);
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'name='+p.version+'\ncode='+code+'\n');
          "
      - name: 构建 APK
        run: |
          cd android
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleRelease --no-daemon || gradle assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/thirdhub-backend.apk
      - name: 校验包内版本串 == server/package.json
        run: |
          cd android
          APK=app/build/outputs/apk/release/thirdhub-backend.apk
          BADGING=$(aapt2 dump badging "$APK" 2>/dev/null || aapt dump badging "$APK")
          echo "$BADGING" | grep -E "^package:"
          echo "$BADGING" | grep -q "versionName='${{ steps.ver.outputs.name }}'" \
            || { echo "::error::包内 versionName 与 server/package.json(${{ steps.ver.outputs.name }}) 不一致"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='${{ steps.ver.outputs.code }}'" \
            || { echo "::error::包内 versionCode 与推导值(${{ steps.ver.outputs.code }}) 不一致"; exit 1; }
      - name: 发 Release（先于 artifact 上传，配额满也不影响交付）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: android/app/build/outputs/apk/release/thirdhub-backend.apk, body: "ThirdHub 后端 APK" }
      # 后端 APK 也是「四通道」交付物，只刷别名会漏掉「版本化对象 + 清单」两条（旧版就是这么
      # 停在 4.2.0 的）。这里把四条通道一次刷齐。
      - name: 上传 Supabase 下载桶（三通道：版本化 / 别名 / 清单）
        env:
          SR: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/thirdhub-backend.apk
          VER="${{ steps.ver.outputs.name }}"; CODE="${{ steps.ver.outputs.code }}"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          BASE="https://mxvxlgjzeboktufumxbp.supabase.co/storage/v1/object"
          CT="Content-Type: application/vnd.android.package-archive"
          # ① 版本化对象
          curl -sf -X POST "$BASE/downloads/thirdhub-backend-$VER.apk" -H "Authorization: Bearer $SR" -H "x-upsert: true" -H "$CT" --data-binary @"$APK"
          # ② 别名对象（网站/客户端的静态直链）
          curl -sf -X POST "$BASE/downloads/thirdhub/thirdhub-backend.apk" -H "Authorization: Bearer $SR" -H "x-upsert: true" -H "$CT" --data-binary @"$APK"
          # ③ 清单 latest-backend.json（客户端「下载中心」实时读它显示版本号）
          printf '{"version":"%s","versionCode":%s,"code":%s,"packageId":"com.thirdhub.backend","url":"https://mxvxlgjzeboktufumxbp.supabase.co/storage/v1/object/public/downloads/thirdhub/thirdhub-backend.apk","notes":"内嵌 Node 家庭后端 v%s（与 server/package.json 同号）","sha256":"%s"}' \
            "$VER" "$CODE" "$CODE" "$VER" "$SHA" > /tmp/latest-backend.json
          curl -sf -X POST "$BASE/downloads/thirdhub/latest-backend.json" -H "Authorization: Bearer $SR" -H "x-upsert: true" -H "Content-Type: application/json" --data-binary @/tmp/latest-backend.json
          # 回读校验：清单必须真的变成这个版本
          GOT=$(curl -sf "https://mxvxlgjzeboktufumxbp.supabase.co/storage/v1/object/public/downloads/thirdhub/latest-backend.json?t=$(date +%s)")
          echo "$GOT"
          echo "$GOT" | grep -q "\"version\":\"$VER\"" || { echo "::error::latest-backend.json 回读版本不一致"; exit 1; }
          echo "$GOT" | grep -q "\"sha256\":\"$SHA\"" || { echo "::error::latest-backend.json 回读 sha256 不一致"; exit 1; }
          echo "三通道 PASS  版本=$VER  体积=$(stat -c%s "$APK")  sha256=$SHA"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: thirdhub-backend-apk, path: android/app/build/outputs/apk/release/*.apk }

  venera-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: 注入 Node 运行时 + server 代码
        run: bash server/scripts/fetch-node-android.sh
      - name: 切换入口为 venera 引擎
        run: echo "venera.js" > android/app/src/main/assets/server/entry.txt
      - name: 接受 Android SDK 许可
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: 注入签名材料
        env:
          KS_A: ${{ secrets.TH_KEYSTORE_BASE64 }}
          KS_B: ${{ secrets.TH_KEY_STORE }}
          SP: ${{ secrets.TH_STORE_PASSWORD }}
          KP: ${{ secrets.TH_KEY_PASSWORD }}
        run: |
          KS="$KS_A"; [ -n "$KS" ] || KS="$KS_B"
          [ -n "$KS" ] || { echo "::error::缺少 keystore secret（TH_KEYSTORE_BASE64 / TH_KEY_STORE）"; exit 1; }
          printf '%s' "$KS" | base64 -d > "$GITHUB_WORKSPACE/android/thirdhub.jks"
          [ -s "$GITHUB_WORKSPACE/android/thirdhub.jks" ] || { echo "::error::keystore 解码为空"; exit 1; }
          {
            echo "storeFile=thirdhub.jks"
            echo "storePassword=$SP"
            echo "keyAlias=thirdhub"
            echo "keyPassword=$KP"
          } > "$GITHUB_WORKSPACE/android/keystore.properties"
          chmod 600 "$GITHUB_WORKSPACE/android/keystore.properties"
          ls -l "$GITHUB_WORKSPACE/android/thirdhub.jks"
      - name: 构建 venera 引擎 APK(独立包名, 可与后端共存)
        run: |
          cd android
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleRelease --no-daemon -PappId=com.thirdhub.venera -PappLabel=venera引擎 -PverName=1.0.0 -PverCode=10000 \
            || gradle assembleRelease --no-daemon -PappId=com.thirdhub.venera -PappLabel=venera引擎 -PverName=1.0.0 -PverCode=10000
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/thirdhub-venera.apk
      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: android/app/build/outputs/apk/release/thirdhub-venera.apk, body: "ThirdHub venera 漫画引擎 APK(THP 直连)" }
      - name: 上传 Supabase 下载桶
        run: |
          curl -s -X POST "https://mxvxlgjzeboktufumxbp.supabase.co/storage/v1/object/downloads/thirdhub/thirdhub-venera.apk" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @android/app/build/outputs/apk/release/thirdhub-venera.apk
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: thirdhub-venera-apk, path: android/app/build/outputs/apk/release/*.apk }

  flutter-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - env:
          TH_KEY_STORE: ${{ secrets.TH_KEY_STORE }}
          TH_STORE_FILE: ../thirdhub.jks
          TH_STORE_PASSWORD: ${{ secrets.TH_STORE_PASSWORD }}
          TH_KEY_PASSWORD: ${{ secrets.TH_KEY_PASSWORD }}
        run: |
          printf '%s' "$TH_KEY_STORE" | base64 --decode > "$GITHUB_WORKSPACE/flutter_app/android/thirdhub.jks"
          mkdir -p /tmp/wrapper && cd /tmp/wrapper && touch settings.gradle && gradle wrapper --gradle-version 8.14 --no-daemon
          cp -r /tmp/wrapper/gradlew /tmp/wrapper/gradlew.bat /tmp/wrapper/gradle "$GITHUB_WORKSPACE/flutter_app/android/"
          cd "$GITHUB_WORKSPACE/flutter_app"
          flutter pub get
          flutter build apk --release --split-per-abi || true
          if [ ! -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            (cd android && ./gradlew :app:assembleRelease --no-daemon)
          fi
          find "$GITHUB_WORKSPACE/flutter_app" -name "*.apk" || true
          APK=$(find "$GITHUB_WORKSPACE/flutter_app" -name "app-arm64-v8a-release.apk" | head -1)
          [ -z "$APK" ] && APK=$(find "$GITHUB_WORKSPACE/flutter_app" -name "app-release.apk" | head -1)
          test -n "$APK"
          mkdir -p build/app/outputs/flutter-apk
          cp "$APK" build/app/outputs/flutter-apk/thirdhub-app.apk
      - name: 发 Release（先于 artifact 上传，配额满也不影响交付）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: flutter_app/build/app/outputs/flutter-apk/thirdhub-app.apk, body: "ThirdHub Flutter 前端 APK" }
      - name: 上传 Supabase 下载桶（网站直链）
        run: |
          curl -s -X POST "https://mxvxlgjzeboktufumxbp.supabase.co/storage/v1/object/downloads/thirdhub/thirdhub-app.apk" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @flutter_app/build/app/outputs/flutter-apk/thirdhub-app.apk
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: thirdhub-flutter-apk, path: flutter_app/build/app/outputs/flutter-apk/*.apk }

  # ── 桌面端三件套: Flutter 跨平台(自用未签名构建) ──
  flutter-desktop:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: windows, out: "build/windows/x64/runner/Release" }
          - { os: macos-latest, target: macos, out: "build/macos/Build/Products/Release" }
          - { os: ubuntu-latest, target: linux, out: "build/linux/x64/release/bundle" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Linux 桌面依赖
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgtk-3-dev
      - name: 构建桌面端
        run: |
          cd flutter_app
          flutter pub get
          flutter config --enable-windows-desktop --enable-macos-desktop --enable-linux-desktop || true
          flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: thirdhub-flutter-${{ matrix.target }}
          path: flutter_app/${{ matrix.out }}

  docker-server:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: |
          cd server
          docker build -t thirdhub/server:4.0.0-m2 .
      # 推送 registry 二期配置

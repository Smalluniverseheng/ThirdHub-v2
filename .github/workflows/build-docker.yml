# 桌面端 / NAS 容器：多架构镜像（全盘升级 #203，2026-11-07）
#
# 为什么交给 CI：本机没有 docker 命令，不能假装本地验过。
# 产物推到 GHCR，NAS 上 `docker compose pull && docker compose up -d` 即可，
# linux/amd64 覆盖 x86 NAS 与云服务器，linux/arm64 覆盖 ARM NAS 与树莓派。
name: build-docker

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/build-docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read backend version (single source of truth)
        id: ver
        run: echo "v=$(node -p "require('./server/package.json').version")" >> "$GITHUB_OUTPUT"

      # ★ GHCR 要求仓库名全小写；github.repository_owner 是 Smalluniverseheng（含大写），
      #   直接拼进 tag 会报 "repository name must be lowercase"（build-docker #1 的真实失败）。
      - name: Resolve lowercase image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/thirdhub-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.v }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ★ 2026-11-07 修「镜像构建绿 ≠ 容器能启动」的假绿：
      #   原写法循环里 curl 失败不计数，最后一行还带 `|| true` ——
      #   哪怕 index.js 因缺 ./neon 直接 MODULE_NOT_FOUND 崩掉，本 step 照样 success。
      #   现在必须真的拿到 /v1/meta 的 200 才算过，失败时打印容器日志再 exit 1。
      - name: Smoke test the image (HTTPS-only /v1/meta，容器起不来必须红)
        run: |
          set -u
          IMAGE='${{ steps.img.outputs.name }}:${{ steps.ver.outputs.v }}'
          docker rm -f th-smoke >/dev/null 2>&1 || true
          docker run -d --name th-smoke -p 19527:9527 "$IMAGE"
          ok=0
          for i in $(seq 1 20); do
            if curl -sk --max-time 3 https://127.0.0.1:19527/v1/meta | grep -q '"object"'; then
              ok=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' th-smoke 2>/dev/null || echo false)" != "true" ]; then
              echo "容器已退出，提前结束等待"; break
            fi
            sleep 2
          done
          echo "---- /v1/meta 响应 ----"
          curl -sk --max-time 5 https://127.0.0.1:19527/v1/meta | head -c 300 || true
          if [ "$ok" -ne 1 ]; then
            echo "---- 容器日志（失败诊断）----"
            docker logs th-smoke 2>&1 | tail -60 || true
            echo "FAIL 冒烟未通过：容器没能在 40 秒内提供 /v1/meta"
            docker rm -f th-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          echo "OK /v1/meta 200，容器确实起来了"
          docker rm -f th-smoke >/dev/null 2>&1 || true
